<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- шрифт Manrope, тянем с гугл-фонтс -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Профиль — HSE clubs NN</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css?v=fixes-20261021c">
</head>
<body data-page="profile">

  <div id="app">
    <div class="page-header"><div class="title">Профиль</div></div>

    <!-- карточка юзера -->
    <div class="section" style="margin-top:0">
      <div class="profile-card">
        <!-- аватарка: если в тг есть фото - подставится она, нет - icons/ava.png -->
        <img class="ava" id="user-ava" src="icons/ava.png" alt="аватарка">
        <div>
          <div class="name" id="user-name">Студент</div>
          <div class="tag" id="user-tag">@hse_student · Студент Вышки</div>
          <span class="role-badge role-user" id="user-role">Пользователь</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label" style="margin-bottom:12px">Мои заявки</div>
      <div class="sub-tabs">
        <button class="sub-tab on" data-stab="active" type="button">Активные</button>
        <button class="sub-tab" data-stab="archive" type="button">Отклонённые / Удалённые<span id="archive-count"></span></button>
      </div>
      <div id="my-submissions">Загрузка заявок...</div>
      <div id="archive-submissions" hidden></div>
    </div>

    <!-- настройки -->
    <div class="section" id="admin-panel-entry" hidden>
      <a href="admin.html" class="btn btn-blue admin-panel-button"><span>▦</span> Панель админа</a>
    </div>

    <div class="section">
      <div class="section-label" style="margin-bottom:12px">Настройки</div>
      <div class="links-list">
        <a href="subs.html">Мои подписки <span class="chev">›</span></a>
        <a href="submit.html">Предложить клуб / событие <span class="chev">›</span></a>
        <a href="about.html">О проекте <span class="chev">›</span></a>
      </div>
    </div>

    <!-- полезные ссылки -->
    <div class="section">
      <div class="section-label" style="margin-bottom:12px">Полезные ссылки</div>
      <div class="links-list" id="site-links-profile"><div class="empty-state">Загрузка ссылок...</div></div>
    </div>

    <div class="section">
      <div class="section-label" style="margin-bottom:12px">Контакты администрации</div>
      <div id="admin-contacts-profile"><div class="empty-state">Загрузка контактов...</div></div>
    </div>

    <!-- кнопка выйти, она просто стирает флажок входа -->
    <div class="section" style="margin-top:28px">
      <button class="btn btn-outline" id="logout-btn">Выйти</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item" data-page="home">
      <span class="nav-icon" data-ico="home"></span>
      <span class="nav-label">Главная</span>
    </button>
    <button class="nav-item" data-page="catalog">
      <span class="nav-icon" data-ico="lupa"></span>
      <span class="nav-label">Каталог</span>
    </button>
    <button class="nav-item" data-page="events">
      <span class="nav-icon" data-ico="rupor"></span>
      <span class="nav-label">События</span>
    </button>
    <button class="nav-item" data-page="subs">
      <span class="nav-icon" data-ico="star"></span>
      <span class="nav-label">Подписки</span>
    </button>
    <button class="nav-item" data-page="profile">
      <span class="nav-icon" data-ico="profile"></span>
      <span class="nav-label">Профиль</span>
    </button>
  </nav>

  <script src="js/common.js?v=fixes-20261021c"></script>
  <script>
    // ============ профиль ============
    // тут имя юзера из телеграма и его аватарка

    (async function init() {
      loadBase().catch(() => {}); // категории нужны, чтобы в заявках показать название, а не id
      const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
      document.getElementById('user-ava').src = getAvaUrl();
      if (user) {
        document.getElementById('user-name').textContent = user.first_name || 'Студент';
        document.getElementById('user-tag').textContent = '@' + (user.username || 'hse_student') + ' · Студент Вышки';
      }
      document.querySelectorAll('.chev').forEach((el) => el.innerHTML = I.chev);

      try {
        const me = await api('/me');
        document.getElementById('user-name').textContent = me.name || 'Пользователь Telegram';
        document.getElementById('user-tag').textContent = me.username ? '@' + me.username + ' · Telegram' : 'Telegram ID: ' + me.telegramId;
        const role = document.getElementById('user-role');
        role.textContent = me.isAdmin ? 'Администратор' : 'Пользователь';
        role.classList.toggle('role-admin', Boolean(me.isAdmin));
        role.classList.toggle('role-user', !me.isAdmin);
        document.getElementById('admin-panel-entry').hidden = !me.isAdmin;
        if (me.isAdmin) localStorage.setItem('hse_role', 'admin');
        else localStorage.removeItem('hse_role');
      } catch (error) {
        document.getElementById('user-role').textContent = 'Пользователь';
        document.getElementById('admin-panel-entry').hidden = true;
      }
    })();

    document.getElementById('logout-btn').addEventListener('click', () => {
      haptic('light');
      logout();
    });

    // Развёрнутое содержимое заявки: поля формы + вложенные фото (без всплывающих окон).
    function renderSubmissionDetails(s, statusNames) {
      let fields = null;
      try { fields = JSON.parse(s.details || ''); } catch (e) { fields = null; }
      let rows = '';
      if (fields && typeof fields === 'object' && !Array.isArray(fields)) {
        const labels = {
          title: 'Название', short: 'Краткое описание', description: 'Описание',
          categoryId: 'Категория', channel: 'Telegram-канал', details: 'Что нужно исправить',
        };
        rows = Object.entries(fields).filter(([, v]) => String(v || '').trim()).map(([key, value]) => {
          let shown = String(value);
          if (key === 'categoryId') {
            const cat = (state.categories || []).find(c => c.id === Number(value));
            shown = cat ? cat.name : shown;
          }
          return `<div class="submission-row"><b>${esc(labels[key] || key)}:</b> ${esc(shown)}</div>`;
        }).join('');
      } else if (String(s.details || '').trim()) {
        rows = `<div class="submission-row">${esc(s.details)}</div>`;
      }
      let media = [];
      try { media = JSON.parse(s.media || '[]'); } catch (e) { media = []; }
      const photos = (Array.isArray(media) ? media : []).filter(m => m && (m.url || m.data))
        .map(m => String(m.url || m.data))
        .filter(src => /^data:image\//i.test(src) || /^https?:\/\//i.test(src));
      const photosHtml = photos.length
        ? `<div class="submission-photos">${photos.map(src => `<a href="${esc(src)}" target="_blank" rel="noopener"><img src="${esc(src)}" alt="Вложение" loading="lazy"></a>`).join('')}</div>`
        : '';
      if (!rows && !photosHtml) return '';
      return `<div class="submission-details">${rows}${photosHtml}</div>`;
    }

    // Карусель заявок: одна карточка видна, переключение мнимыми стрелками.
    // Используется и для активных заявок, и для архива.
    function renderSubmissionsCarousel(box, list, statusNames, buildCard) {
      const cards = list.map(buildCard).join('');
      box.innerHTML = `
        <div class="submissions-carousel">
          ${list.length > 1 ? `<button class="carousel-arrow prev" data-slide="prev" type="button" aria-label="Предыдущая заявка">&lsaquo;</button><button class="carousel-arrow next" data-slide="next" type="button" aria-label="Следующая заявка">&rsaquo;</button>` : ''}
          <div class="submissions-track">${cards}</div>
          ${list.length > 1 ? `<div class="submissions-counter"></div>` : ''}
        </div>`;
      const slides = Array.from(box.querySelectorAll('.submissions-track .history-card'));
      let index = 0;
      const show = (i) => {
        index = (i + slides.length) % slides.length;
        slides.forEach((el, idx) => { el.hidden = idx !== index; });
        const counter = box.querySelector('.submissions-counter');
        if (counter) counter.textContent = (index + 1) + ' / ' + slides.length;
      };
      box.querySelectorAll('[data-slide]').forEach(button => {
        button.addEventListener('click', () => {
          haptic('light');
          show(index + (button.dataset.slide === 'next' ? 1 : -1));
        });
      });
      show(0);
    }

    async function loadMySubmissions() {
      const box = document.getElementById('my-submissions');
      await loadBase().catch(() => {}); // ждём категории для названий в заявках

      try {
        const list = await api('/submissions/my');

        if (!list.length) {
          box.textContent = 'У вас пока нет заявок';
          return;
        }

        const statusNames = {
          pending: 'На модерации',
          approved: 'Одобрена',
          changes: 'Нужны исправления',
          rejected: 'Отклонена',
          published: 'Опубликована',
          draft: 'Черновик',
          cancelled: 'Отменена',
          removed: 'Клуб удалён'
        };

        renderSubmissionsCarousel(box, list, statusNames, (s) => {
          const detailsHtml = renderSubmissionDetails(s, statusNames);
          return `
          <div class="history-card" data-card="${s.id}">
            <b>Заявка №${s.id}</b>
            <div>Тип: ${esc(s.type)}</div>
            <div>Создана: ${new Date(s.createdAt).toLocaleString('ru-RU')}</div>
            <div>Статус: ${esc(statusNames[s.status] || s.status)}</div>
            <div>Комментарий администратора: ${esc(s.adminComment || 'Нет')}</div>
            ${s.publishedAt ? `<div>Дата публикации: ${new Date(s.publishedAt).toLocaleString('ru-RU')}</div>` : ''}
            ${detailsHtml}
            ${s.status === 'changes' ? `<button class="btn btn-orange" data-resend="${s.id}">Отправить исправления</button>` : ''}
            ${['pending', 'changes', 'draft'].includes(s.status) ? `<button class="btn btn-outline" data-cancel="${s.id}">Отменить заявку</button>` : ''}
          </div>`;
        });

        box.querySelectorAll('[data-edit], [data-resend]').forEach(button => {
          button.addEventListener('click', () => {
            location.href = 'submit.html?edit=' + (button.dataset.edit || button.dataset.resend) + (button.dataset.resend ? '&resend=1' : '');
          });
        });

        box.querySelectorAll('[data-cancel]').forEach(button => {
          button.addEventListener('click', async () => {
            if (!confirm('Отменить заявку?')) return;
            try {
              await api('/submissions/' + button.dataset.cancel + '/cancel', {
                method: 'POST',
                body: JSON.stringify({})
              });
              await loadMySubmissions();
            } catch (e) {
              toast(e.message);
            }
          });
        });
      } catch (e) {
        box.textContent = 'Не удалось загрузить заявки';
      }
    }

    loadMySubmissions();

    // Архив: отклонённые заявки и записи об удалённых клубах
    async function loadArchive() {
      const box = document.getElementById('archive-submissions');
      await loadBase().catch(() => {});
      try {
        const list = await api('/submissions/archive');
        document.getElementById('archive-count').textContent = list.length ? ' (' + list.length + ')' : '';
        if (!list.length) { box.innerHTML = '<div class="empty-state">У вас пока нет заявок</div>'; return; }
        const archiveStatuses = { rejected: 'Отклонена', removed: 'Клуб удалён' };
        renderSubmissionsCarousel(box, list, archiveStatuses, (s) => {
          const detailsHtml = renderSubmissionDetails(s, archiveStatuses);
          return `
          <div class="history-card archive-card" data-card="${s.id}">
            <b>Заявка №${s.id}</b>
            <div>Тип: ${esc(s.type)}</div>
            <div>Название: ${esc(s.title || 'Без названия')}</div>
            <div>Создана: ${new Date(s.createdAt).toLocaleString('ru-RU')}</div>
            <div>Статус: ${esc(archiveStatuses[s.status] || s.status)}</div>
            <div>Комментарий администратора: ${esc(s.adminComment || 'Нет')}</div>
            ${detailsHtml}
          </div>`;
        });
      } catch (e) {
        box.innerHTML = '<div class="empty-state">Не удалось загрузить архив</div>';
      }
    }
    loadArchive();

    document.querySelectorAll('.sub-tab').forEach(button => button.addEventListener('click', () => {
      haptic('light');
      document.querySelectorAll('.sub-tab').forEach(b => b.classList.toggle('on', b === button));
      const archive = button.dataset.stab === 'archive';
      document.getElementById('my-submissions').hidden = archive;
      document.getElementById('archive-submissions').hidden = !archive;
    }));

    loadPublicAppInfo().catch((error) => {
      const links = document.getElementById('site-links-profile');
      const contacts = document.getElementById('admin-contacts-profile');
      if (links) links.textContent = 'Не удалось загрузить ссылки';
      if (contacts) contacts.textContent = 'Не удалось загрузить контакты';
      console.error(error);
    });
  </script>
</body>
</html>
