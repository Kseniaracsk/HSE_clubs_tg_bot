<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- шрифт Manrope, тянем с гугл-фонтс -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Категория — HSE clubs NN</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css?v=hse-full-update-20261013">
</head>
<!-- подсвечиваем Каталог, потому что эта страница из каталога -->
<body data-page="catalog">

  <div id="app">
    <!-- шапка: назад и кнопка подписки на категорию -->
    <div class="cat-header">
      <a class="back-btn" href="catalog.html"><span class="back-ico"></span></a>
      <button class="sub-cat-btn" id="sub-cat">Подписаться на категорию</button>
    </div>

    <!-- название и описание категории вставит js -->
    <div class="cat-title" id="cat-title"></div>
    <div class="cat-desc" id="cat-desc"></div>
    <div class="cat-count"><span class="chip-gray" id="cat-count"></span></div>

    <div class="section">
      <div class="section-label" style="margin-bottom:12px">Все клубы категории</div>
      <div id="club-list"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item" data-page="home">
      <span class="nav-icon" data-ico="home"></span>
      <span class="nav-label">Главная</span>
    </button>
    <button class="nav-item" data-page="catalog">
      <span class="nav-icon" data-ico="lupa"></span>
      <span class="nav-label">Каталог</span>
    </button>
    <button class="nav-item" data-page="events">
      <span class="nav-icon" data-ico="rupor"></span>
      <span class="nav-label">События</span>
    </button>
    <button class="nav-item" data-page="subs">
      <span class="nav-icon" data-ico="star"></span>
      <span class="nav-label">Подписки</span>
    </button>
    <button class="nav-item" data-page="profile">
      <span class="nav-icon" data-ico="profile"></span>
      <span class="nav-label">Профиль</span>
    </button>
  </nav>

  <script src="js/common.js?v=hse-full-update-20261013"></script>
  <script>
    // ============ страница одной категории ============
    // открывается так: category.html?id=1

    document.querySelector('.back-ico').innerHTML = I.back;

    const catId = Number(new URLSearchParams(location.search).get('id'));

    async function renderPage() {
      // ищем нашу категорию в списке
      const cat = state.categories.find((c) => c.id === catId);
      if (!cat) {
        document.getElementById('cat-title').textContent = 'Категория не найдена :(';
        return;
      }

      const clubs = await api('/clubs?category=' + catId);
      const subbed = state.categorySubs.includes(catId);

      document.title = cat.name + ' — HSE clubs NN';
      document.getElementById('cat-title').textContent = cat.name;
      document.getElementById('cat-desc').textContent = cat.description;
      document.getElementById('cat-count').textContent = clubs.length + ' клубов';

      // кнопка подписки
      const btn = document.getElementById('sub-cat');
      btn.classList.toggle('active', subbed);
      btn.textContent = subbed ? 'Вы подписаны на категорию' : 'Подписаться на категорию';

      // клубы этой категории
      document.getElementById('club-list').innerHTML = clubs.map((c) => `
        <a class="club-row" href="club.html?id=${c.id}">
          <div class="logo"></div>
          <div class="info">
            <div class="name">${esc(c.name)}</div>
            <div class="sub">${esc(c.short || 'Краткое описание клуба')}</div>
          </div>
          <span class="chev">${I.chev}</span>
        </a>`).join('');
    }

    // кнопка подписаться/отписаться на категорию
    document.getElementById('sub-cat').addEventListener('click', async (e) => {
      const res = await api(`/categories/${catId}/subscribe`, { method: 'POST' });
      state.categorySubs = res.categorySubs;
      haptic('medium');
      const on = state.categorySubs.includes(catId);
      e.target.classList.toggle('active', on);
      e.target.textContent = on ? 'Вы подписаны на категорию' : 'Подписаться на категорию';
    });

    // старт
    (async function init() {
      await loadBase();
      await renderPage();
    })();
  </script>
</body>
</html>
